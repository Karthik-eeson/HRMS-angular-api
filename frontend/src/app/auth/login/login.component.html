<section class="login-form">
    <div class="login position">
        <div class="login-card">
            <div class="text-center">
                <img src="../../../assets/images/Afablez.png" alt="">
            </div>
            <form (ngSubmit)="clickLogin(loginForm)" #loginForm="ngForm">
                <div class="pt-3">
                    <label for="email">Email Id</label>
                     <input  type="text" style="display:none">
                    <input
                        type="email" 
                        email
                        id="email" 
                        name="email" 
                        placeholder="Email ID" 
                        required 
                        [(ngModel)]="loginFormData.emailId"
                        >
                    <!-- Validation Errors -->
                    <!-- <div *ngIf="email.invalid && email.touched" class="error">
                        <div *ngIf="email.errors?.['required']">Email is required</div>
                        <div *ngIf="email.errors?.['pattern']">Invalid email format</div>
                    </div> -->
                </div>
            
                <div class="pt-3">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Password" 
                        required
                        [(ngModel)]="loginFormData.password"
                        >
                    <!-- Validation Errors -->
                    <!-- <div *ngIf="password.invalid && password.touched" class="error">
                        <div *ngIf="password.errors?.['required']">Password is required</div>
                    </div> -->
                </div>
                <div class="mt-5 text-center login-btn">
                    <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
                    <button type="submit" [disabled]="isLoading">
                     {{ isLoading ? 'Signing in...' : 'Login' }}
                    </button>
                  </div>
                <div class="mt-3 text-center">
                    <a class="forgot">Forgot Password ?</a>
                </div>
            </form>
        </div>
    </div>
</section>
