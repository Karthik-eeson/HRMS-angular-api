<main class="login-page">
  <section class="login-card" aria-label="Afablez login">
    <img class="logo" src="assets/images/Afablez.png" alt="Afablez Semiconductor">

    <form (ngSubmit)="clickLogin(loginForm)" #loginForm="ngForm" novalidate [attr.aria-busy]="isLoading">
      <div class="field">
        <label for="email">Email Id</label>
        <input id="email" type="email" name="email" autocomplete="username"
          placeholder="Email Id" required email #email="ngModel"
          [(ngModel)]="loginFormData.emailId" [readOnly]="isLoading"
          [attr.aria-invalid]="email.invalid && email.touched"
          [attr.aria-describedby]="email.invalid && email.touched ? 'email-error' : null">
        <p id="email-error" class="error" *ngIf="email.invalid && email.touched">Enter a valid email address.</p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password"
          placeholder="Password" required #password="ngModel"
          [(ngModel)]="loginFormData.password" [readOnly]="isLoading"
          [attr.aria-invalid]="password.invalid && password.touched"
          [attr.aria-describedby]="password.invalid && password.touched ? 'password-error' : null">
        <p id="password-error" class="error" *ngIf="password.invalid && password.touched">Enter your password.</p>
      </div>

      <p class="error login-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <div class="actions">
        <button class="login-button" type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
        <button class="forgot-button" type="button" (click)="showPasswordHelp = !showPasswordHelp"
          [attr.aria-expanded]="showPasswordHelp" aria-controls="password-help">
          Forgot Password ?
        </button>
        <p id="password-help" class="help" *ngIf="showPasswordHelp" role="status">
          Contact your workspace administrator to reset your password.
        </p>
      </div>
    </form>
  </section>
</main>
